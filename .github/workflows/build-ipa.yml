name: Build OpenVideoPlayer iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project OpenVideoPlayer.xcodeproj \
            -scheme OpenVideoPlayer \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.5' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project OpenVideoPlayer.xcodeproj \
            -scheme OpenVideoPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/OpenVideoPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/OpenVideoPlayer.xcarchive/Products/Applications/OpenVideoPlayer.app build/Payload/
          cd build && zip -r OpenVideoPlayer.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenVideoPlayer-Unsigned-IPA
          path: build/OpenVideoPlayer.ipa
          retention-days: 14

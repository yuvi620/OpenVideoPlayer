name: Build OpenVideoPlayer iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Application for Device (Unsigned)
        run: |
          xcodebuild build \
            -project OpenVideoPlayer.xcodeproj \
            -scheme OpenVideoPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products -name "OpenVideoPlayer.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::OpenVideoPlayer.app not found in build products"
            find build -maxdepth 4
            exit 1
          fi
          echo "Found compiled app bundle at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          
          # Verify Info.plist existence and validity
          if [ ! -f "build/Payload/OpenVideoPlayer.app/Info.plist" ]; then
            echo "::error::Info.plist missing from Payload/OpenVideoPlayer.app"
            ls -la build/Payload/OpenVideoPlayer.app/
            exit 1
          fi
          echo "=== Info.plist Content ==="
          plutil -p build/Payload/OpenVideoPlayer.app/Info.plist

          # Package IPA
          cd build && zip -qr OpenVideoPlayer.ipa Payload/
          ls -lh OpenVideoPlayer.ipa
          
          echo "=== IPA Archive Structure ==="
          unzip -l OpenVideoPlayer.ipa | head -n 30

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenVideoPlayer-Unsigned-IPA
          path: build/OpenVideoPlayer.ipa
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: "OpenVideoPlayer v1.0.0 (Build ${{ github.run_number }})"
          files: build/OpenVideoPlayer.ipa
          make_latest: true
          body: |
            ### OpenVideoPlayer iOS Direct IPA
            Download `OpenVideoPlayer.ipa` directly below to install with SideStore, AltStore, or Sideloadly.

  test:
    name: Run Unit Tests
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project OpenVideoPlayer.xcodeproj \
            -scheme OpenVideoPlayer \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual

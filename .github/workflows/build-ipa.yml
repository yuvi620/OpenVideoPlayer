name: Build OpenVideoPlayer iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Application for Device (Unsigned)
        run: |
          xcodebuild build \
            -project OpenVideoPlayer.xcodeproj \
            -scheme OpenVideoPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products -name "OpenVideoPlayer.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::OpenVideoPlayer.app not found in build products"
            find build -maxdepth 4
            exit 1
          fi
          echo "Found compiled app bundle at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -qr OpenVideoPlayer.ipa Payload/
          ls -lh OpenVideoPlayer.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenVideoPlayer-Unsigned-IPA
          path: build/OpenVideoPlayer.ipa
          retention-days: 14

  test:
    name: Run Unit Tests
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project OpenVideoPlayer.xcodeproj \
            -scheme OpenVideoPlayer \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual
